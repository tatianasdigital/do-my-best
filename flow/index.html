<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DO MY BEST — First screen (F12 → F13 → F14)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Boldonse&family=Manrope:wght@500&family=Syne:wght@400;600&display=block" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!--
    First screen, Figma file 78XlrFPw66iWdkqGPpQ2ua, Page 3:
      F12 (30:515) initial state  — yellow background, dark "WORLD / BUILDERS."
      F13 (30:631) after the fill — black background, #E3F14A titles, F13 chrome
      F14 (30:573) final state    — Title2 "DESTROYERS." + Character (melts in last)
    Every scene holds a .stage: a 1920×1080 box in Figma coordinates, scaled to fit.
    Bottom → top:
      scene--f12    : yellow background, dark titles (entrance masks), studio label
      scene--f13    : black background, yellow titles + the WebGL Title2 morph canvas,
                      revealed by the vertical-column fill (fill.js)
      scene--chrome : logo, Social links, Scroll hint, Navigation (F12 → F13 colours)
  -->
  <main class="viewport" id="viewport" data-state="intro" aria-label="DO MY BEST — World builders. World destroyers.">

    <!-- F12 -->
    <div class="scene scene--f12">
      <div class="stage">
        <p class="studio-label">INDIE GAME STUDIO</p>
        <!-- Each title sits in an invisible mask exactly as wide as its text:
             Title1 slides out of the mask's left edge, Title2 out of its right edge. -->
        <div class="title-mask title-mask--1"><span class="title-text title1">World</span></div>
        <div class="title-mask title-mask--2"><span class="title-text title2">BUILDERS.</span></div>
      </div>
    </div>

    <!-- F13 / F14: revealed column by column -->
    <div class="scene scene--f13" aria-hidden="true">
      <div class="stage">
        <p class="studio-label">INDIE GAME STUDIO</p>
        <span class="title title1 title1--f13">World</span>
        <span class="title title2 title2--f13">BUILDERS.</span>
        <span class="title title2 title2--f14">destroyers.</span>
        <canvas class="flow-canvas"></canvas>
        <!-- F14 Character (32:689), above the titles; melts in with the same shader -->
        <div class="character"><img src="../assets/f04-character.png" width="1920" height="1080" alt="Character holding a pistol"></div>
        <canvas class="char-canvas"></canvas>
      </div>
    </div>

    <!-- Chrome -->
    <div class="scene scene--chrome">
      <div class="stage">
        <img class="logo" src="../assets/logo.png" width="100" height="100" alt="DO MY BEST">
        <div class="social" aria-label="Social links">
          <span class="social__icon"><img class="social__f12" src="../assets/f01-social-icon.svg" width="24" height="24" alt=""><img class="social__f13" src="assets/f13-social-icon.svg" width="24" height="24" alt=""></span>
          <span class="social__icon"><img class="social__f12" src="../assets/f01-social-icon.svg" width="24" height="24" alt=""><img class="social__f13" src="assets/f13-social-icon.svg" width="24" height="24" alt=""></span>
          <span class="social__icon"><img class="social__f12" src="../assets/f01-social-icon.svg" width="24" height="24" alt=""><img class="social__f13" src="assets/f13-social-icon.svg" width="24" height="24" alt=""></span>
        </div>
        <p class="scroll-hint">( Scroll )</p>
        <div class="nav"><span class="nav__label">menu</span><span class="nav__icon"><i></i><i></i><i></i></span></div>
      </div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="fill.js"></script>
  <script src="flow.js"></script>
  <script src="main.js"></script>
</body>
</html>
